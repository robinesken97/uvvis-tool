name: Build UVVisTool

on:
  push:
    tags: ["v*"]          # git tag v1.0.0 && git push --tags  -> Release mit allen drei Apps
  workflow_dispatch:      # oder manuell unter "Actions" starten

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-14,       label: macos-arm64 }
          - { os: ubuntu-22.04,   label: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt-Bibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Abhängigkeiten
        run: pip install -r requirements.txt pyinstaller

      - name: Selbsttest aus dem Quellcode
        env: { QT_QPA_PLATFORM: offscreen }
        run: python uvvis_gui.py --selftest selftest_src --selftest-isnet

      - name: App bauen
        run: python build.py

      - name: Selbsttest der fertigen App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\UVVisTool\UVVisTool.exe" `
               -ArgumentList "--selftest","selftest_app","--selftest-isnet" -Wait -PassThru
          Get-Content selftest_app\selftest_report.txt
          exit $p.ExitCode

      - name: Selbsttest der fertigen App (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/UVVisTool.app/Contents/MacOS/UVVisTool --selftest selftest_app --selftest-isnet
          cat selftest_app/selftest_report.txt

      - name: Selbsttest der fertigen App (Linux)
        if: runner.os == 'Linux'
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          dist/UVVisTool/UVVisTool --selftest selftest_app --selftest-isnet
          cat selftest_app/selftest_report.txt

      - name: Packen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\UVVisTool -DestinationPath UVVisTool-${{ matrix.label }}.zip

      - name: Packen (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/UVVisTool.app UVVisTool-${{ matrix.label }}.zip

      - name: Packen (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf UVVisTool-${{ matrix.label }}.tar.gz UVVisTool

      - uses: actions/upload-artifact@v4
        with:
          name: UVVisTool-${{ matrix.label }}
          path: UVVisTool-${{ matrix.label }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.label }}
          path: selftest_*/selftest_report.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: UVVisTool-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: UVVisTool-*
